<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Can Fly - Voice Controlled</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="400" height="600"></canvas>

            <!-- Game UI Overlay -->
            <div id="gameOverlay" class="overlay">
                <div id="startScreen" class="screen active">
                    <h1>🦆 Duck Can Fly</h1>
                    <p>Keep talking to keep the duck flying!</p>
                    <button id="startBtn" class="btn">Start Game</button>
                    <p class="hint">Microphone access required</p>
                </div>

                <div id="gameOverScreen" class="screen">
                    <h1>Game Over!</h1>
                    <p>Score: <span id="finalScore">0</span></p>
                    <button id="restartBtn" class="btn">Play Again</button>
                </div>
            </div>

            <!-- Voice Level Indicator -->
            <div id="voiceIndicator" class="voice-indicator">
                <div class="indicator-label">Voice Level</div>
                <div class="indicator-bar-container">
                    <div id="voiceBar" class="indicator-bar"></div>
                    <div id="thresholdLine" class="threshold-line"></div>
                </div>
                <div id="voiceStatus" class="voice-status">Silent</div>
            </div>

            <!-- Score Display -->
            <div id="scoreDisplay" class="score-display">0</div>

            <!-- Fullscreen Button -->
            <button id="fullscreenBtn" class="fullscreen-btn" title="Toggle Fullscreen">⛶</button>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel">
            <h2>⚙️ Settings</h2>

            <div class="settings-section">
                <h3>🎤 Audio Settings</h3>
                <div class="setting-item">
                    <label>Silence Threshold (dB)</label>
                    <input type="range" id="silenceThreshold" min="-80" max="-20" value="-50" step="1">
                    <span id="silenceThresholdValue">-50</span>
                </div>
                <div class="setting-item">
                    <label>Min Volume for Lift (dB)</label>
                    <input type="range" id="minVolume" min="-80" max="-20" value="-45" step="1">
                    <span id="minVolumeValue">-45</span>
                </div>
                <div class="setting-item">
                    <label>Smoothing Factor</label>
                    <input type="range" id="smoothing" min="0" max="0.99" value="0.8" step="0.01">
                    <span id="smoothingValue">0.8</span>
                </div>
            </div>

            <div class="settings-section">
                <h3>🪶 Physics Settings</h3>
                <div class="setting-item">
                    <label>Gravity</label>
                    <input type="range" id="gravity" min="0.1" max="2" value="0.5" step="0.05">
                    <span id="gravityValue">0.5</span>
                </div>
                <div class="setting-item">
                    <label>Base Lift Force</label>
                    <input type="range" id="baseLift" min="0.5" max="5" value="2" step="0.1">
                    <span id="baseLiftValue">2</span>
                </div>
                <div class="setting-item">
                    <label>Max Lift Force</label>
                    <input type="range" id="maxLift" min="2" max="10" value="4.5" step="0.1">
                    <span id="maxLiftValue">4.5</span>
                </div>
                <div class="setting-item">
                    <label>Fall Multiplier (Silence)</label>
                    <input type="range" id="fallMultiplier" min="1" max="5" value="2" step="0.1">
                    <span id="fallMultiplierValue">2</span>
                </div>
                <div class="setting-item">
                    <label>Max Velocity Up</label>
                    <input type="range" id="maxVelocityUp" min="2" max="15" value="8" step="0.5">
                    <span id="maxVelocityUpValue">8</span>
                </div>
                <div class="setting-item">
                    <label>Max Velocity Down</label>
                    <input type="range" id="maxVelocityDown" min="2" max="15" value="10" step="0.5">
                    <span id="maxVelocityDownValue">10</span>
                </div>
                <div class="setting-item">
                    <label>Velocity Dampening</label>
                    <input type="range" id="dampening" min="0.8" max="0.99" value="0.92" step="0.01">
                    <span id="dampeningValue">0.92</span>
                </div>
            </div>

            <div class="settings-section">
                <h3>🎮 Game Settings</h3>
                <div class="setting-item">
                    <label>Pipe Gap</label>
                    <input type="range" id="pipeGap" min="100" max="300" value="180" step="10">
                    <span id="pipeGapValue">180</span>
                </div>
                <div class="setting-item">
                    <label>Pipe Speed</label>
                    <input type="range" id="pipeSpeed" min="1" max="8" value="3" step="0.5">
                    <span id="pipeSpeedValue">3</span>
                </div>
                <div class="setting-item">
                    <label>Pipe Spacing</label>
                    <input type="range" id="pipeSpacing" min="150" max="400" value="250" step="10">
                    <span id="pipeSpacingValue">250</span>
                </div>
                <div class="setting-item">
                    <label>Duck Size</label>
                    <input type="range" id="duckSize" min="15" max="40" value="25" step="1">
                    <span id="duckSizeValue">25</span>
                </div>
            </div>

            <button id="resetSettings" class="btn btn-secondary">Reset to Defaults</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="game.js"></script>
</body>
</html>
