<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Duck Can Fly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-secondary {
            background: #cbd5e0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #a0aec0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f7fafc;
            color: #4a5568;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
        }

        tr:hover {
            background: #f7fafc;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍🎓 Student Management</h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Total Students</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);">
                <div class="stat-number" id="totalSessions">0</div>
                <div class="stat-label">Total Sessions</div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="showAddModal()">➕ Add Student</button>
            <button class="btn btn-secondary" onclick="location.href='frontend.html'">🎮 Back to Game</button>
        </div>

        <table id="studentsTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Created At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsBody">
                <tr>
                    <td colspan="5" class="empty-state">
                        <div class="empty-state-icon">📚</div>
                        <div>Loading students...</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="studentModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Add Student</div>
            <div class="form-group">
                <label for="studentName">Name *</label>
                <input type="text" id="studentName" placeholder="Enter student name" required>
            </div>
            <div class="form-group">
                <label for="studentEmail">Email</label>
                <input type="email" id="studentEmail" placeholder="Enter student email (optional)">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-success" onclick="saveStudent()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'http://localhost:8000';
        let editingStudentId = null;

        // Load students on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadStudents();
        });

        async function loadStudents() {
            try {
                const response = await fetch(`${BACKEND_URL}/students`);
                const students = await response.json();

                const tbody = document.getElementById('studentsBody');

                if (students.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-state">
                                <div class="empty-state-icon">📚</div>
                                <div>No students yet. Click "Add Student" to create one.</div>
                            </td>
                        </tr>
                    `;
                } else {
                    tbody.innerHTML = students.map(student => `
                        <tr>
                            <td>${student.id}</td>
                            <td><strong>${student.name}</strong></td>
                            <td>${student.email || '-'}</td>
                            <td>${new Date(student.created_at).toLocaleDateString()}</td>
                            <td>
                                <button class="btn btn-primary" style="padding: 8px 16px; font-size: 14px;" onclick="editStudent(${student.id}, '${student.name}', '${student.email || ''}')">Edit</button>
                                <button class="btn btn-danger" style="padding: 8px 16px; font-size: 14px;" onclick="deleteStudent(${student.id}, '${student.name}')">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                }

                // Update stats
                document.getElementById('totalStudents').textContent = students.length;

                // Get total sessions count
                const sessionsResponse = await fetch(`${BACKEND_URL}/sessions/1`);
                // This is a hack - need to implement a proper endpoint
                document.getElementById('totalSessions').textContent = '...';

            } catch (error) {
                console.error('Error loading students:', error);
                alert('Failed to load students. Make sure backend is running.');
            }
        }

        function showAddModal() {
            editingStudentId = null;
            document.getElementById('modalTitle').textContent = 'Add Student';
            document.getElementById('studentName').value = '';
            document.getElementById('studentEmail').value = '';
            document.getElementById('studentModal').classList.add('active');
        }

        function editStudent(id, name, email) {
            editingStudentId = id;
            document.getElementById('modalTitle').textContent = 'Edit Student';
            document.getElementById('studentName').value = name;
            document.getElementById('studentEmail').value = email === 'null' ? '' : email;
            document.getElementById('studentModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('studentModal').classList.remove('active');
        }

        async function saveStudent() {
            const name = document.getElementById('studentName').value.trim();
            const email = document.getElementById('studentEmail').value.trim();

            if (!name) {
                alert('Please enter a name');
                return;
            }

            try {
                const formData = new FormData();
                formData.append('name', name);
                formData.append('email', email || '');

                let response;
                if (editingStudentId) {
                    response = await fetch(`${BACKEND_URL}/students/${editingStudentId}`, {
                        method: 'PUT',
                        body: formData
                    });
                } else {
                    response = await fetch(`${BACKEND_URL}/students`, {
                        method: 'POST',
                        body: formData
                    });
                }

                if (response.ok) {
                    closeModal();
                    loadStudents();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.detail);
                }
            } catch (error) {
                console.error('Error saving student:', error);
                alert('Failed to save student');
            }
        }

        async function deleteStudent(id, name) {
            if (!confirm(`Are you sure you want to delete "${name}"?`)) {
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/students/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadStudents();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.detail);
                }
            } catch (error) {
                console.error('Error deleting student:', error);
                alert('Failed to delete student');
            }
        }
    </script>
</body>
</html>
