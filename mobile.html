<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <title>🦆 Duck Can Fly - Mobile</title>
    <link rel="stylesheet" href="mobile-styles.css">
</head>
<body>
    <div class="mobile-container">
        <!-- Game Canvas -->
        <div class="game-area">
            <canvas id="gameCanvas"></canvas>

            <!-- Game Overlay -->
            <div id="gameOverlay" class="overlay">
                <div id="startScreen" class="screen active">
                    <h1>🦆 Duck Can Fly</h1>
                    <p>Nói liên tục để giữ vịt bay!</p>
                    <button id="startBtn" class="btn-mobile">Bắt Đầu</button>
                    <p class="hint">Cần quyền truy cập microphone</p>
                </div>

                <div id="gameOverScreen" class="screen">
                    <h1>Game Over!</h1>
                    <p class="score-text">Điểm: <span id="finalScore">0</span></p>
                    <button id="restartBtn" class="btn-mobile">Chơi Lại</button>
                </div>
            </div>

            <!-- Voice Indicator (Mobile) -->
            <div id="voiceIndicator" class="voice-indicator-mobile">
                <div class="indicator-bar-mobile">
                    <div id="voiceBar" class="bar-fill"></div>
                </div>
                <div id="voiceStatus" class="voice-status-mobile">Silent</div>
            </div>

            <!-- Score Display -->
            <div id="scoreDisplay" class="score-display-mobile">0</div>

            <!-- Mobile Controls -->
            <div class="mobile-controls">
                <button id="settingsToggle" class="control-btn">⚙️</button>
                <button id="fullscreenBtn" class="control-btn">⛶</button>
            </div>
        </div>

        <!-- Settings Panel (Collapsible) -->
        <div id="settingsPanel" class="settings-panel-mobile">
            <div class="settings-header">
                <h2>⚙️ Cài Đặt</h2>
                <button id="closeSettings" class="close-btn">✕</button>
            </div>

            <div class="settings-scroll">
                <div class="settings-section-mobile">
                    <h3>🎤 Âm Thanh</h3>
                    <div class="setting-item-mobile">
                        <label>Ngưỡng Im Lặng</label>
                        <div class="slider-group">
                            <input type="range" id="silenceThreshold" min="-80" max="-20" value="-50" step="1">
                            <span id="silenceThresholdValue">-50</span>
                        </div>
                    </div>
                    <div class="setting-item-mobile">
                        <label>Âm Lượng Tối Thiểu</label>
                        <div class="slider-group">
                            <input type="range" id="minVolume" min="-80" max="-20" value="-45" step="1">
                            <span id="minVolumeValue">-45</span>
                        </div>
                    </div>
                    <div class="setting-item-mobile">
                        <label>Làm Mượt</label>
                        <div class="slider-group">
                            <input type="range" id="smoothing" min="0" max="0.99" value="0.8" step="0.01">
                            <span id="smoothingValue">0.8</span>
                        </div>
                    </div>
                </div>

                <div class="settings-section-mobile">
                    <h3>🪶 Vật Lý</h3>
                    <div class="setting-item-mobile">
                        <label>Trọng Lực</label>
                        <div class="slider-group">
                            <input type="range" id="gravity" min="0.1" max="2" value="0.5" step="0.05">
                            <span id="gravityValue">0.5</span>
                        </div>
                    </div>
                    <div class="setting-item-mobile">
                        <label>Lực Nâng Cơ Bản</label>
                        <div class="slider-group">
                            <input type="range" id="baseLift" min="0.5" max="5" value="2" step="0.1">
                            <span id="baseLiftValue">2</span>
                        </div>
                    </div>
                    <div class="setting-item-mobile">
                        <label>Lực Nâng Tối Đa</label>
                        <div class="slider-group">
                            <input type="range" id="maxLift" min="2" max="10" value="4.5" step="0.1">
                            <span id="maxLiftValue">4.5</span>
                        </div>
                    </div>
                </div>

                <div class="settings-section-mobile">
                    <h3>🎮 Trò Chơi</h3>
                    <div class="setting-item-mobile">
                        <label>Khoảng Hở Ống</label>
                        <div class="slider-group">
                            <input type="range" id="pipeGap" min="100" max="300" value="180" step="10">
                            <span id="pipeGapValue">180</span>
                        </div>
                    </div>
                    <div class="setting-item-mobile">
                        <label>Tốc Độ Ống</label>
                        <div class="slider-group">
                            <input type="range" id="pipeSpeed" min="1" max="8" value="3" step="0.5">
                            <span id="pipeSpeedValue">3</span>
                        </div>
                    </div>
                    <div class="setting-item-mobile">
                        <label>Kích Thước Vịt</label>
                        <div class="slider-group">
                            <input type="range" id="duckSize" min="15" max="40" value="25" step="1">
                            <span id="duckSizeValue">25</span>
                        </div>
                    </div>
                </div>

                <button id="resetSettings" class="btn-reset-mobile">Khôi Phục Mặc Định</button>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="mobile-game.js"></script>
</body>
</html>
